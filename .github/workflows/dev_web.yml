# CI/CD environment DEV (branch `main`) — frontend React (Vite) treding-view-chart.
#
#   Pull request ke main  -> CI saja: lint + typecheck + build + audit dependency + cek Dockerfile
#                            bisa di-build. Tidak ada yang di-push/deploy — PR gagal = jangan di-merge.
#   Push / merge ke main   -> CI, lalu build image & push ke GHCR (ghcr.io), lalu deploy ke VPS
#                            dev lewat SSH (docker compose pull + up).
#
# Hanya berjalan kalau kode frontend berubah (src/, public/, package*.json, Dockerfile, ...).
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets). Koneksi SSH sama dengan repo
# backend karena VPS-nya sama:
#   DEV_VPS_HOST      IP / hostname VPS dev
#   DEV_VPS_USER      user SSH di VPS (mis. root / deploy)
#   DEV_VPS_SSH_KEY   private key SSH (isi file id_ed25519, termasuk baris BEGIN/END)
#   DEV_VPS_PORT      port SSH (opsional, default 22)
#   DEV_WEB_APP_DIR   folder frontend dev di VPS (mis. /root/app/treding-view-chart-dev)
#
# Variables (tab Variables, bukan Secrets). VITE_* ditanam ke bundle saat build dan terlihat oleh
# siapa pun yang membuka web, jadi BUKAN rahasia — jangan taruh token/API key di sini:
#   DEV_VITE_API_URL   mis. https://api-dev.domainmu.com/api
#   DEV_VITE_WS_URL    mis. wss://api-dev.domainmu.com/api/
# Push ke GHCR memakai GITHUB_TOKEN bawaan — tidak perlu secret tambahan.

name: Dev - Web CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/dev_web.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/dev_web.yml"
  workflow_dispatch:

# Push beruntun ke main -> run lama dibatalkan, hanya yang terbaru yang dideploy.
concurrency:
  group: dev-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bauagg/treding-view-chart
  NODE_VERSION: "22"

jobs:
  # -------------------------------------------------------------------------------------------
  # 1. CI: lint, typecheck + build, audit keamanan dependency.
  # -------------------------------------------------------------------------------------------
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # `npm run build` = tsc -b (typecheck) + vite build. URL dummy cukup, hasil build dibuang.
      - name: Typecheck & build
        env:
          VITE_API_URL: http://localhost/api
          VITE_WS_URL: ws://localhost/api/
        run: npm run build

      # CVE di dependency runtime ditampilkan di log, tidak menggagalkan build. Perbaiki dengan
      # menaikkan versi di package.json.
      - name: Audit dependency (informasi)
        run: npm audit --omit=dev || echo "::warning::npm audit menemukan CVE — cek log di atas"

  # -------------------------------------------------------------------------------------------
  # 2. Build image Docker. PR: hanya dicek bisa di-build. Push ke main: di-push ke GHCR.
  # -------------------------------------------------------------------------------------------
  image:
    name: Docker image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag image
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Variabel VITE_* ditanam ke bundle di sini; URL dev beda dengan prod -> image tidak
          # bisa dipakai lintas environment.
          build-args: |
            VITE_API_URL=${{ vars.DEV_VITE_API_URL || 'http://localhost/api' }}
            VITE_WS_URL=${{ vars.DEV_VITE_WS_URL || 'ws://localhost/api/' }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------------------------
  # 3. Deploy ke VPS dev (hanya push/merge ke main, bukan PR).
  # -------------------------------------------------------------------------------------------
  deploy:
    name: Deploy dev
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret & variable
        env:
          SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          VPS_USER: ${{ secrets.DEV_VPS_USER }}
          APP_DIR: ${{ secrets.DEV_WEB_APP_DIR }}
          API_URL: ${{ vars.DEV_VITE_API_URL }}
          WS_URL: ${{ vars.DEV_VITE_WS_URL }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$VPS_HOST" ] || fail "Secret DEV_VPS_HOST kosong / tidak ditemukan"
          [ -n "$VPS_USER" ] || fail "Secret DEV_VPS_USER kosong / tidak ditemukan"
          [ -n "$APP_DIR" ]  || fail "Secret DEV_WEB_APP_DIR kosong / tidak ditemukan"
          [ -n "$API_URL" ]  || fail "Variable DEV_VITE_API_URL kosong (tab Variables, bukan Secrets)"
          [ -n "$WS_URL" ]   || fail "Variable DEV_VITE_WS_URL kosong (tab Variables, bukan Secrets)"
          [ -n "$SSH_KEY" ]  || fail "Secret DEV_VPS_SSH_KEY kosong / tidak ditemukan (cek nama & tab Secrets -> Repository secrets)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          head -1 "$RUNNER_TEMP/deploy_key" | grep -q -- "-----BEGIN" \
            || fail "DEV_VPS_SSH_KEY tidak diawali baris -----BEGIN OPENSSH PRIVATE KEY-----"
          grep -q -- "-----END" "$RUNNER_TEMP/deploy_key" \
            || fail "DEV_VPS_SSH_KEY tidak diakhiri baris -----END OPENSSH PRIVATE KEY-----"
          ssh-keygen -lf "$RUNNER_TEMP/deploy_key" \
            || fail "DEV_VPS_SSH_KEY bukan private key yang valid (mungkin yang disalin file .pub?)"
          rm -f "$RUNNER_TEMP/deploy_key"

      # docker-compose.yml selalu ikut versi terbaru di repo.
      - name: Kirim docker-compose.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.DEV_WEB_APP_DIR }}

      - name: Pull image & restart web
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.DEV_WEB_APP_DIR }}
          VITE_API_URL: ${{ vars.DEV_VITE_API_URL }}
          VITE_WS_URL: ${{ vars.DEV_VITE_WS_URL }}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          port: ${{ secrets.DEV_VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR,VITE_API_URL,VITE_WS_URL
          script: |
            set -e
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            # Variabel compose environment dev — container treding-web, port debug 127.0.0.1:3000.
            # Nginx Proxy Manager meneruskan ke treding-web:8080 lewat network proxy-net.
            # VITE_* hanya dibutuhkan compose untuk interpolasi (image sudah jadi, tidak di-build ulang).
            printf 'IMAGE_TAG=%s\nCONTAINER_PREFIX=treding\nWEB_PORT_HOST=3000\nVITE_API_URL=%s\nVITE_WS_URL=%s\n' \
              "$IMAGE_TAG" "$VITE_API_URL" "$VITE_WS_URL" > .env
            docker network inspect proxy-net >/dev/null 2>&1 || docker network create proxy-net
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull web
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            sleep 5
            docker compose ps
            docker compose logs --tail 30 web
            # Gagal deploy kalau web tidak menjawab.
            curl -fsS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/
